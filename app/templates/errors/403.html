{% extends "base.html" %}
{% block title %}403 Access Denied{% endblock %}
{% block content %}
<div class="container text-center py-5">
    <div class="glass-card p-5 mx-auto" style="max-width: 500px;">
        <h1 class="display-1 fw-bold text-warning">403</h1>
        <h3>Access Denied</h3>
        <p class="text-muted">You do not have administrative or auditor authorization to view this protected resource.</p>
        <a href="{{ url_for('main.index') }}" class="btn btn-primary rounded-pill px-4">Return Home</a>
    </div>
</div>
{% endblock %}
