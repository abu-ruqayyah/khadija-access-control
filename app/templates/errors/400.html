{% extends "base.html" %}
{% block title %}400 Bad Request{% endblock %}
{% block content %}
<div class="container text-center py-5">
    <div class="glass-card p-5 mx-auto" style="max-width: 500px;">
        <h1 class="display-1 fw-bold text-danger">400</h1>
        <h3>Bad Request</h3>
        <p class="text-muted">The server could not process the request due to invalid parameters or malformed syntax.</p>
        <a href="{{ url_for('main.index') }}" class="btn btn-primary rounded-pill px-4">Return Home</a>
    </div>
</div>
{% endblock %}
