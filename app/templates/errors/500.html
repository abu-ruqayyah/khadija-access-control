{% extends "base.html" %}
{% block title %}500 Internal Server Error{% endblock %}
{% block content %}
<div class="container text-center py-5">
    <div class="glass-card p-5 mx-auto" style="max-width: 500px;">
        <h1 class="display-1 fw-bold text-danger">500</h1>
        <h3>Internal Server Error</h3>
        <p class="text-muted">An unexpected server error occurred. The security event has been logged for investigation.</p>
        <a href="{{ url_for('main.index') }}" class="btn btn-primary rounded-pill px-4">Return Home</a>
    </div>
</div>
{% endblock %}
