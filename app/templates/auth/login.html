{% extends "base.html" %}

{% block title %}Log In — Khadija Bukar Access Control Audit{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="glass-card p-4 p-md-5 shadow-lg border-0">
                <div class="text-center mb-4">
                    <div class="d-inline-flex p-3 bg-primary bg-opacity-10 text-primary rounded-circle mb-2">
                        <i class="bi bi-shield-lock-fill fs-2"></i>
                    </div>
                    <h3 class="fw-bold mb-1">Auditor Sign In</h3>
                    <p class="text-muted small">Access Least Privilege Audit & Role Control Center</p>
                </div>

                <form method="POST" action="{{ url_for('auth.login') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                    <div class="mb-3">
                        <label for="username" class="form-label fw-medium">Username or Email</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" id="username" name="username" placeholder="e.g. khadija_auditor" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label fw-medium">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-key"></i></span>
                            <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg w-100 rounded-pill shadow-sm mb-3">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                    </button>
                </form>

                <div class="bg-light p-3 rounded border text-center small mt-3">
                    <span class="d-block fw-semibold text-dark mb-1">🔑 Demo Lead Auditor Credentials:</span>
                    <span class="d-block text-muted">Username: <code>khadija_auditor</code></span>
                    <span class="d-block text-muted">Password: <code>AuditAdminPassword123!</code></span>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
