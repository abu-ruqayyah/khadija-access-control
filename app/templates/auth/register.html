{% extends "base.html" %}

{% block title %}Register Staff Account — Khadija Bukar{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="glass-card p-4 p-md-5 shadow-lg border-0">
                <div class="text-center mb-4">
                    <div class="d-inline-flex p-3 bg-info bg-opacity-10 text-info rounded-circle mb-2">
                        <i class="bi bi-person-plus-fill fs-2"></i>
                    </div>
                    <h3 class="fw-bold mb-1">Create Auditor / Staff Account</h3>
                    <p class="text-muted small">Register to participate in organizational access control review</p>
                </div>

                <form method="POST" action="{{ url_for('auth.register') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="username" class="form-label fw-medium">Username</label>
                            <input type="text" class="form-control" id="username" name="username" placeholder="e.g. k_bukar" required>
                        </div>
                        <div class="col-md-6">
                            <label for="email" class="form-label fw-medium">Email Address</label>
                            <input type="email" class="form-control" id="email" name="email" placeholder="khadijahbukarbiu@gmail.com" required>
                        </div>
                        <div class="col-12">
                            <label for="full_name" class="form-label fw-medium">Full Name</label>
                            <input type="text" class="form-control" id="full_name" name="full_name" placeholder="Khadija Bukar" required>
                        </div>
                        <div class="col-md-6">
                            <label for="department" class="form-label fw-medium">Department</label>
                            <select class="form-select" id="department" name="department" required>
                                <option value="IT Security & Compliance">IT Security & Compliance</option>
                                <option value="Cloud Infrastructure">Cloud Infrastructure</option>
                                <option value="Human Resources">Human Resources</option>
                                <option value="Finance">Finance</option>
                                <option value="IT Support">IT Support</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="job_title" class="form-label fw-medium">Job Title</label>
                            <input type="text" class="form-control" id="job_title" name="job_title" placeholder="Access Control Security Auditor" required>
                        </div>
                        <div class="col-12">
                            <label for="password" class="form-label fw-medium">Password</label>
                            <input type="password" class="form-control" id="password" name="password" placeholder="Minimum 8 characters" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-info text-dark fw-bold btn-lg w-100 rounded-pill shadow-sm mt-4">
                        <i class="bi bi-check-circle me-1"></i> Register Account
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
